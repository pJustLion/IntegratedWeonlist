name: WeonList Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar WeonList para Android
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Guardar archivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: WeonList-Android
          path: output/*.geode
