
name: Build WeonList

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [Android64, Win64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM 20
        if: matrix.target == 'Win64'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20 llvm-20

          mkdir -p "$RUNNER_TEMP/llvm20-bin"
          ln -sf /usr/bin/clang-20 "$RUNNER_TEMP/llvm20-bin/clang"
          ln -sf /usr/bin/clang++-20 "$RUNNER_TEMP/llvm20-bin/clang++"

          echo "$RUNNER_TEMP/llvm20-bin" >> "$GITHUB_PATH"
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: WeonList-${{ matrix.target }}
          path: output/*.geode
