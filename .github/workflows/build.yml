
name: Build WeonList

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
            os: ubuntu-latest

          - target: Win64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: WeonList-${{ matrix.target }}
          path: output/*.geode
          if-no-files-found: error
